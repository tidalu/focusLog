name: Desktop AI release gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      live_provider_smoke:
        description: 'Run opt-in live provider certification with protected secrets'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  fast-pr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm --filter @focuslog/desktop lint
      - run: pnpm --filter @focuslog/desktop typecheck
      - run: pnpm --filter @focuslog/desktop exec vitest run --config vitest.config.ts electron/ai/phase5-ux-diagnostics-packaging-service.test.ts
      - run: pnpm contracts:check

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @focuslog/desktop test
      - run: pnpm --filter @focuslog/desktop exec vitest run --config vitest.config.ts electron/ai/phase5-certification-service.test.ts electron/ai/phase5-reliability-service.test.ts electron/ai/phase5-provider-performance-certification.test.ts electron/ai/phase5-ux-diagnostics-packaging-service.test.ts
      - run: pnpm --filter @focuslog/desktop build

  release-candidate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @focuslog/desktop package:win
      - name: Packaged launch smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/FocusLog-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\FocusLog\Uninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installed application did not include an uninstaller.' }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
      - name: Opt-in live provider certification
        if: github.event_name != 'pull_request' && inputs.live_provider_smoke == 'true'
        env:
          FOCUSLOG_PHASE5C_LIVE: '1'
          FOCUSLOG_LIVE_OPENAI_API_KEY: ${{ secrets.FOCUSLOG_LIVE_OPENAI_API_KEY }}
          FOCUSLOG_LIVE_OPENAI_MODEL: ${{ vars.FOCUSLOG_LIVE_OPENAI_MODEL }}
          FOCUSLOG_LIVE_OLLAMA_MODEL: ${{ vars.FOCUSLOG_LIVE_OLLAMA_MODEL }}
          FOCUSLOG_LIVE_OPENAI_COMPATIBLE_ENDPOINT: ${{ secrets.FOCUSLOG_LIVE_OPENAI_COMPATIBLE_ENDPOINT }}
          FOCUSLOG_LIVE_OPENAI_COMPATIBLE_MODEL: ${{ vars.FOCUSLOG_LIVE_OPENAI_COMPATIBLE_MODEL }}
        run: node apps/desktop/dist-electron/ai/phase5-provider-performance-runner.js
      - uses: actions/upload-artifact@v4
        with:
          name: focuslog-windows-desktop-ai-release
          path: apps/desktop/release/FocusLog-Setup-*.exe
